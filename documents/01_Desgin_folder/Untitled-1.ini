    # Điều mình muốn bổ sung so với OpenMMLab

    OpenMMLab chủ yếu tập trung vào **AI Framework** (training, evaluation, model management). Bạn đang hướng tới **Vision Platform**, nên cần mở rộng thêm các tầng mà OpenMMLab không bao phủ đầy đủ:

    * Camera Management
    * Annotation Platform
    * DataOps
    * Workflow Engine
    * Edge Agent
    * Service Layer
    * Dashboard
    * Smart Factory Solutions
    * Notification & Alert
    * PLC/MQTT Integration
