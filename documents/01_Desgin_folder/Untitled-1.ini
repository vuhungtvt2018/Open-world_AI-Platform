    ## 1. Cấu trúc Thư mục Monorepo Tổng thể

    ```text
    vision-ai-platform/
    ├── packages/               # CÁC VIÊN GẠCH LEGO (Luôn tuân thủ một chiều)
    │   ├── 01-core/            # Định nghĩa abstract classes, schema, types
    │   ├── 02-utils/           # Tiện ích toán học, xử lý ảnh cơ bản
    │   ├── 03-camera/          # Driver, stream ingestion, frame buffer
    │   ├── 04-ai/              # Toàn bộ AI engines, tasks, MLOps lifecycle
    │   └── 05-workflow/        # Node-based DAG execution, state machine
    │
    ├── services/               # CÁC MICROSERVICES / BACKEND DAEMONS
    │   ├── camera-service/     # Quản lý vòng đời camera, RTSP/GenICam server
    │   ├── inference-service/  # gRPC/REST API serving model inference
    │   ├── workflow-service/   # Orchestrator thực thi các pipeline
    │   ├── deployment-service/ # Quản lý model registry, push xuống edge
    │   └── notification-service/# Alerting, webhook, Kafka/RabbitMQ producer
    │
    ├── solutions/              # CÁC GÓI ĐÓNG GÓI THEO DOMAIN (Bussiness Logic)
    │   ├── smart-factory/      # Kiểm tra ngoại quan (AOI), lỗi sản phẩm
    │   ├── warehouse/          # Đọc mã vạch/QR, đo kích thước kiện hàng
    │   ├── retail/             # Heatmap, đếm người, nhận diện hành vi
    │   ├── traffic/            # Nhận diện biển số (ALPR), đếm xe, đo tốc độ
    │   └── robotics/           # Visual SLAM, hand-eye calibration, bin picking
    │
    ├── apps/                   # CÁC ỨNG DỤNG ĐẦU CUỐI (END-USER APPS)
    │   ├── dashboard/          # Web UI quản lý tổng thể (Next.js/React)
    │   ├── annotation/         # Tool gán nhãn hoặc adapter kết nối CVAT/Label Studio
    │   ├── training/           # Web UI/Job submitter cho huấn luyện mô hình
    │   ├── edge-agent/         # Lightweight daemon chạy trên IPC/Jetson/Edge Box
    │   └── cli/                # Command-line tool quản trị, debug pipeline
    │
    ├── infrastructure/         # Terraform, K8s charts, Dockerfiles, CI/CD pipelines
    └── pyproject.toml / package.json # Root workspace config

    ```

    ---

    ## 2. Phân tầng Kiến trúc & Chiều Phụ thuộc (DAG)

    Quy tắc bất biến: **Tầng $N$ chỉ được phép import từ tầng $0$ đến $N-1$.**

    ```text
    [solutions] & [apps]       (Tầng 7 - Domain & UI)
        │
    [services]                 (Tầng 6 - API & Network communication)
        │
    [packages/workflow]        (Tầng 5 - Pipeline Orchestration)
        │
    [packages/ai]              (Tầng 4 - AI Engines, Tasks & MLOps)
        │
    [packages/camera]          (Tầng 3 - Hardware & Streaming I/O)
        │
    [packages/utils]           (Tầng 2 - Helpers, Math, Processing)
        │
    [packages/core]            (Tầng 1 - Base Types, Interfaces, Exceptions)

    ```

    ### Tầng 1: `core` (Foundation)

    * **Chức năng:** Nơi chứa ngôn ngữ chung của toàn hệ thống. Không có business logic, không phụ thuộc vào bất kỳ thư viện nặng nào (như PyTorch hay OpenCV).
    * **Thành phần:**
    * `types`: Data structures chuẩn (`Frame`, `BoundingBox`, `PolygonMask`, `Keypoint3D`, `Tracklet`, `InferenceResult`).
    * `interfaces`: Abstract Base Classes (`BaseCamera`, `BaseModel`, `BaseTracker`, `BaseWorkflowNode`, `BaseMetric`).
    * `config`: Base Pydantic models cho configuration.
    * `exceptions`: Hệ thống lỗi chuẩn hóa (`CameraStreamError`, `ModelLoadError`, `InferenceTimeoutError`).



    ### Tầng 2: `utils` (Stateless Helpers)

    * **Chức năng:** Các hàm hỗ trợ thuần túy không lưu trạng thái (stateless).
    * **Thành phần:**
    * `image`: Convert màu (RGB/BGR/NV12), resize, padding, crop (sử dụng NumPy/OpenCV mức cơ bản).
    * `geometry`: Tính IoU (Intersection over Union), NMS (Non-Maximum Suppression) cơ bản, transform tọa độ 2D/3D.
    * `network`: Helper tải file từ S3/MinIO, retry requests.
    * `logger`: Structured logging wrapper (JSON log, OpenTelemetry tracing traces).



    ### Tầng 3: `camera` (Hardware & Stream Layer)

    * **Chức năng:** Tách biệt hoàn toàn phần cứng thu hình ảnh khỏi phần xử lý AI.
    * **Thành phần:**
    * `drivers`: Wrappers cho RTSP/GStreamer, GenICam/GigE Vision (cho camera công nghiệp Basler/FLIR), USB/Webcam, Video file giả lập cho test.
    * `buffer`: Ring-buffer, zero-copy frame sharing trong bộ nhớ (Shared Memory / CUDA IPC) để không bị nghẽn khi FPS cao.
    * `calibration`: Lưu trữ và tính toán ma trận thông số nội (intrinsic) / ngoại (extrinsic), khử biến dạng ống kính (undistortion).



    ---

    ## 3. Thiết Kế Chi Tiết Gói `packages/ai` (The AI Engine & MLOps)

    Đây là khối trung tâm nhất, tích hợp đầy đủ 6 bài toán CV và toàn bộ vòng đời kỹ thuật. `packages/ai` chỉ phụ thuộc vào `core` và `utils`.

    ```text
    packages/ai/
    ├── tasks/                 # 6 Bài toán trọng tâm (implement các interfaces từ core)
    │   ├── classification/    # Multi-class, multi-label, anomaly scoring
    │   ├── detection/         # Oriented Bounding Boxes (OBB), 2D/3D Detection
    │   ├── segmentation/      # Semantic, Instance, và Panoptic Segmentation
    │   ├── pose/              # 2D/3D Human Keypoints, Hand/Face Mesh, Skeleton
    │   ├── tracking/          # SORT, DeepSORT, ByteTrack, Multi-camera tracking
    │   └── recognition/       # Face ID, OCR, License Plate recognition (Feature extraction + Matching)
    │
    ├── engines/               # Tầng tối ưu hóa Inference (Runtime Adapters)
    │   ├── onnxruntime/       # CPU / GPU execution provider
    │   ├── tensorrt/          # FP16/INT8 quantization, CUDA graphs cho Nvidia Jetson/Tesla
    │   ├── openvino/          # Tối ưu cho Intel CPU/iGPU/NPU
    │   └── pytorch/           # Development & Training fallback
    │
    ├── engineering/           # Toàn bộ Data-Ops & MLOps Infrastructure
    │   ├── dataset/           # Adapters cho COCO, YOLO, PascalVOC; DVC (Data Version Control) connectors
    │   ├── data_ops/          # Active Learning sampling, Data deduplication, Synthetic data generation
    │   ├── annotation/        # Auto-labeling pipelines, CVAT/Label Studio export/import formats
    │   ├── model/             # Model Registry client (MLflow/W&B), model format converters (PT -> ONNX -> TRT)
    │   ├── training/          # Abstract Trainer, distributed training (DDP), loss functions, optimizers
    │   ├── validation/        # K-fold cross validation, drift detection (Data/Concept drift)
    │   ├── experiment/        # Experiment tracking hooks (TensorBoard, MLflow, ClearML)
    │   └── metrics/           # mAP@0.5:0.95, F1-Score, MOTA, IDF1, FPS/Latency profiling
    │
    └── pipeline/              # Micro-pipelines nội bộ của AI (e.g., Preprocessing -> Inference -> Postprocessing)

    ```

    ---

    ## 4. Các Tầng Lắp Ráp Cấp Cao (`workflow`, `services`, `solutions`)

    ### Tầng 5: `packages/workflow` (DAG Execution Engine)

    * **Chức năng:** Biến các class rời rạc từ `camera` và `ai` thành một chuỗi xử lý logic có thể cấu hình bằng JSON/YAML mà không cần re-compile code.
    * **Cách hoạt động:**
    * Định nghĩa các `Node`: `CameraSourceNode` $\rightarrow$ `FrameSkipNode` $\rightarrow$ `YoloDetectionNode` $\rightarrow$ `ByteTrackNode` $\rightarrow$ `ZoneAlarmNode`.
    * Hỗ trợ xử lý bất đồng bộ (Asynchronous execution), queue giữa các node, và tự động thu hồi tài nguyên (garbage collection cho GPU memory).



    ### Tầng 6: `services` (Distribution & Scale)

    * Mỗi service đóng gói các package dưới nó thành các tiến trình độc lập, giao tiếp qua **gRPC / REST / Kafka / ZeroMQ**.
    * *Ví dụ:* `inference-service` sẽ import `packages/ai` và `packages/core`. Khi nhận gRPC request chứa tensor hoặc frame pointer, nó gọi engine TensorRT để ra kết quả và trả về proto message.

    ### Tầng 7: `solutions` và `apps` (Đỉnh của Kim Tự Tháp)

    Nơi duy nhất chứa quy tắc nghiệp vụ thực tế (Business Logic). Không viết code xử lý ảnh ở đây; chỉ lắp ráp modules.

    **Ví dụ một bài toán Smart Factory (Kiểm tra ngoại quan lỗi bo mạch):**

    1. **Cấu hình YAML trong `solutions/smart-factory/`:**
    * Camera driver: `GigEVisionCamera` (từ `packages/camera`).
    * Pipeline: `AOI_PCB_Inspection_Workflow` (từ `packages/workflow`).
    * AI Models: `PCB_Anomaly_Segmentation_v2` + `Barcode_Recognition_v1` (từ `packages/ai`).


    2. **Ứng dụng `apps/edge-agent`:**
