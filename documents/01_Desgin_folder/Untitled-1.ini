    Kiến trúc Vision AI Platform theo mô hình monorepo với nguyên tắc **Directed Acyclic Graph (DAG - Đồ thị có hướng không chu trình)** đảm bảo tính cô lập tuyệt đối: lớp tầng trên chỉ được phép gọi tầng dưới, tầng dưới hoàn toàn "mù" về tầng trên. Khi một dự án mới phát sinh, kỹ sư chỉ việc "lắp ráp" các module có sẵn thành một pipeline mới mà không cần viết lại hay copy code nền tảng.

    Dưới đây là bản thiết kế quy chuẩn cho kiến trúc monorepo này, tối ưu cho Python/C++ (backend/AI) và TypeScript (UI/Edge apps), sử dụng công cụ quản lý workspace như **Poetry/UV Workspaces** hoặc **Nx / Turborepo**.

